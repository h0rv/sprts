[tools]
zig = "0.16.0"
node = "24.15.0"
"github:christianhelle/openapi2zig" = "0.5.6"

[tasks.check]
run = "zig build test && zig build && zig build -Doptimize=ReleaseSafe && zig build wasm && cd packages/core && zig build test && cd ../../clients/espn && zig build test && cd ../sprts && zig build test && zig build && cd ../../apps/server && zig build test && zig build && (test -d ../cli && (cd ../cli && zig build test && zig build) || echo 'skip apps/cli: not landed yet')"

[tasks.serve]
run = "zig build run"

[tasks."generate:espn"]
run = "tools/generate-espn-client"

[tasks."generate:sprts-client"]
run = "tools/generate-sprts-client"

[tasks."run:cli"]
run = "cd apps/cli && zig build run"

[tasks."package:cli"]
description = "Cross-compile sprts-tui release tarballs + SHA256SUMS into apps/cli/dist/"
run = "apps/cli/scripts/package-release.sh"

[tasks.deploy]
description = "Build wasm and deploy to Cloudflare Workers (sprts.horv.co)"
run = "npx wrangler deploy --env wasm"

[tasks."generate:art"]
run = "tools/generate-art --write"
