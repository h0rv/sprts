[tools]
zig = "0.16.0"
node = "24.15.0"
"github:christianhelle/openapi2zig" = "0.5.6"

[tasks.check]
run = "zig build test && zig build && zig build -Doptimize=ReleaseSafe && cd packages/core && zig build test && cd ../../clients/espn && zig build test && cd ../../apps/server && zig build test && zig build"

[tasks.serve]
run = "zig build run"

[tasks."generate:espn"]
run = "tools/generate-espn-client"
